<header>
  <p>{{ nombre }}</p>
  <p>{{ profesion }}</p>
  <p>{{ frase }}</p>
  <nav>
    <button [disabled]="seccionActiva() === 'resumen'" (click)="seccionSeleccionada.emit('resumen')">Resumen</button>
    <button [disabled]="seccionActiva() === 'experiencia'" (click)="seccionSeleccionada.emit('experiencia')">Experiencia</button>
    <button [disabled]="seccionActiva() === 'formacion'" (click)="seccionSeleccionada.emit('formacion')">Formación</button>
  </nav>
</header>
